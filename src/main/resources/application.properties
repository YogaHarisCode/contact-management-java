spring.application.name=contact-management-java

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:1234}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/contact_management}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10

logging.level.root=INFO
logging.level.contactmanagement=${LOG_LEVEL:INFO}