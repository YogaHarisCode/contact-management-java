spring.application.name=contact-management-java

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${USERNAME_DATABASE:root}
spring.datasource.password=${PASSWORD_DATABASE:1234}
spring.datasource.url=${URL_DATABASE:jdbc:mysql://localhost:3306/contact_management}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
