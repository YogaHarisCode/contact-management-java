spring.application.name=contact-management-java

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${TEST_DATABASE_URL:jdbc:mysql://localhost:3306/contact_management_test?createDatabaseIfNotExist=true}
spring.datasource.username=${TEST_DATABASE_USERNAME:root}
spring.datasource.password=${TEST_DATABASE_PASSWORD:1234}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true